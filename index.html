<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buddy</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
margin:0;
padding:20px;
background:#f5f5f7;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:16px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input,textarea,button{
width:100%;
padding:12px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:14px;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

.entry{
margin-top:12px;
padding:14px;
border-radius:12px;
border:1px solid #eee;
background:#fafafa;
}

.small{
font-size:12px;
opacity:.6;
}

.row{
display:flex;
gap:8px;
margin-top:8px;
}

.row button{
flex:1;
font-size:12px;
padding:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Buddy Log</h2>
<div class="small">Data stored privately on this device</div>

<input id="title" placeholder="Title">

<textarea id="notes" placeholder="Notes"></textarea>

<button onclick="addEntry()">Save Entry</button>

</div>

<div class="card">

<h3>Entries</h3>

<div id="entries"></div>

</div>

<div class="card">

<h3>Backup</h3>

<button onclick="exportData()">Export Backup</button>

<input type="file" onchange="importData(event)">

</div>

</div>

<script>

let entries = JSON.parse(localStorage.getItem("buddy_entries") || "[]")

function save(){
localStorage.setItem("buddy_entries",JSON.stringify(entries))
}

function render(){

const container=document.getElementById("entries")

container.innerHTML=""

entries.slice().reverse().forEach((e,index)=>{

const div=document.createElement("div")

div.className="entry"

div.innerHTML=`

<strong>${e.title}</strong>

<div class="small">
${new Date(e.date).toLocaleString()}
</div>

<div>${e.notes}</div>

<div class="row">

<button onclick="editEntry(${index})">Edit</button>

<button onclick="deleteEntry(${index})">Delete</button>

</div>

`

container.appendChild(div)

})

}

function addEntry(){

const title=document.getElementById("title").value
const notes=document.getElementById("notes").value

if(!title)return

entries.push({
title,
notes,
date:new Date().toISOString()
})

save()

document.getElementById("title").value=""
document.getElementById("notes").value=""

render()

}

function deleteEntry(i){

entries.splice(i,1)

save()

render()

}

function editEntry(i){

let entry=entries[i]

const newTitle=prompt("Edit title",entry.title)
if(newTitle===null)return

const newNotes=prompt("Edit notes",entry.notes)

entry.title=newTitle
entry.notes=newNotes

save()

render()

}

function exportData(){

const blob=new Blob([JSON.stringify(entries)],{type:"application/json"})
const url=URL.createObjectURL(blob)

const a=document.createElement("a")
a.href=url
a.download="buddy_backup.json"
a.click()

}

function importData(e){

const file=e.target.files[0]
if(!file)return

const reader=new FileReader()

reader.onload=function(event){

entries=JSON.parse(event.target.result)

save()

render()

}

reader.readAsText(file)

}

render()

</script>

</body>
</html>
