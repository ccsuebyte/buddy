<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="buddy.">
<meta name="theme-color" content="#C4784E">
<title>buddy.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#F7F3EE;--white:#FDFAF7;--parchment:#EDE6DC;
  --terra:#C4784E;--terra2:#9E5A35;--blush:#E8C4B0;--rose:#D4998A;
  --sage:#7A9E7E;--sage-pale:#D4E2D3;--dusty:#9BAF9A;
  --ink:#1E1209;--ink2:#5C4A38;--ink3:#9B866F;
  --red:#C05C5C;--green:#5A9E6A;--gold:#B8860B;
  --font:'Geist',system-ui,sans-serif;
}
html,body{font-family:var(--font);background:var(--cream);color:var(--ink);max-width:430px;margin:0 auto;min-height:100vh;font-size:15px}
.nav{background:var(--white);border-bottom:1px solid var(--parchment);padding:12px 18px 0;position:sticky;top:0;z-index:50}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.app-name{font-size:20px;font-weight:600;color:var(--terra);letter-spacing:-0.5px}
.nav-right{display:flex;align-items:center;gap:10px}
.eye-btn{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:18px;padding:2px 4px;display:flex;align-items:center;transition:color .2s}
.eye-btn.hidden-on{color:var(--terra)}
.nav-tabs{display:flex}
.nt{flex:1;text-align:center;padding:8px 2px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;font-weight:500}
.nt.on{color:var(--terra);border-bottom-color:var(--terra)}
.pg{display:none;padding-bottom:80px}
.pg.on{display:block}
/* PAYDAY */
.payday{background:var(--sage-pale);border-radius:12px;margin:10px 16px 8px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--dusty)}
.pd-label{font-size:10px;color:var(--sage);font-weight:500}
.pd-amt{font-size:13px;font-weight:600;color:var(--green)}
.pd-quote{font-size:10px;color:var(--sage);font-style:italic;margin-top:1px}
/* PERIOD SWITCHER */
.period-switch{display:flex;background:var(--parchment);border-radius:20px;padding:3px;margin:0 16px 10px;gap:2px}
.ps-btn{flex:1;text-align:center;padding:6px 4px;border-radius:17px;font-size:11px;font-weight:500;color:var(--ink3);cursor:pointer;transition:all .2s;border:none;background:transparent;font-family:var(--font)}
.ps-btn.on{background:var(--white);color:var(--terra);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* DUAL BUDGET COMPARE */
.dual-compare{margin:0 16px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc-panel{background:var(--white);border-radius:12px;border:1px solid var(--parchment);overflow:hidden}
.dc-panel.active-period{border-color:var(--terra);border-width:1.5px}
.dc-head{padding:8px 10px;border-bottom:1px solid var(--parchment);background:var(--cream);display:flex;justify-content:space-between;align-items:center}
.dc-period{font-size:10px;font-weight:600;color:var(--ink2)}
.dc-tag{font-size:9px;background:var(--blush);color:var(--terra2);padding:2px 6px;border-radius:8px;font-weight:500}
.dc-tag.now{background:var(--terra);color:white}
.dc-totals{padding:8px 10px;border-bottom:1px solid var(--parchment)}
.dc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.dc-row:last-child{margin-bottom:0}
.dc-lbl{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
.dc-val{font-size:12px;font-weight:600}
.dc-val.inc{color:var(--green)}.dc-val.exp{color:var(--red)}.dc-val.rem-pos{color:var(--terra)}.dc-val.rem-neg{color:var(--red)}
.dc-budgets{padding:6px 10px}
.dc-brow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.dc-brow:last-child{margin-bottom:0}
.dc-bname{font-size:10px;color:var(--ink2);display:flex;align-items:center;gap:4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-bamt{font-size:10px;font-weight:600;white-space:nowrap;margin-left:4px}
.dc-bamt.over{color:var(--red)}.dc-bamt.ok{color:var(--ink2)}
.dc-bbar{height:2px;background:var(--parchment);border-radius:1px;overflow:hidden;margin-top:2px}
.dc-bfill{height:100%;border-radius:1px}
/* FLOW WIDGET */
.flow-widget{background:var(--white);border-radius:14px;margin:0 16px 10px;padding:12px 14px;border:1px solid var(--parchment)}
.flow-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.flow-col{text-align:center;position:relative}
.flow-col+.flow-col::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--parchment)}
.flow-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.flow-val{font-size:17px;font-weight:600;line-height:1.1}
.fv-inc{color:var(--green)}.fv-exp{color:var(--red)}.fv-rem-pos{color:var(--terra)}.fv-rem-neg{color:var(--red)}
.flow-period{font-size:10px;color:var(--ink3);margin-top:8px;text-align:center;border-top:1px solid var(--parchment);padding-top:8px}
/* SECTION HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
.sh-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3)}
.sh-action{font-size:12px;color:var(--terra);font-weight:500;cursor:pointer}
/* BUDGET TABLE */
.budget-table{margin:0 16px 4px;background:var(--white);border-radius:14px;border:1px solid var(--parchment);overflow:hidden}
.bt-header{display:grid;grid-template-columns:1fr 80px 80px;padding:8px 14px;border-bottom:1px solid var(--parchment);background:var(--cream)}
.bt-th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3)}
.bt-th:nth-child(2),.bt-th:nth-child(3){text-align:right}
.bt-row{display:grid;grid-template-columns:1fr 80px 80px;padding:10px 14px;border-bottom:1px solid var(--parchment);align-items:center;cursor:pointer}
.bt-row:last-child{border-bottom:none}
.bt-row:active{background:var(--cream)}
.bt-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;min-width:0}
.bt-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.bt-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-cell{text-align:right;font-size:13px;font-weight:500}
.bt-cell.over{color:var(--red)}.bt-cell.ok{color:var(--ink)}.bt-cell.bdgt{color:var(--ink3);font-weight:400}
.bt-bar-row{padding:0 14px 8px;margin-top:-6px}
.bt-bar{height:3px;background:var(--parchment);border-radius:2px;overflow:hidden}
.bt-fill{height:100%;border-radius:2px;transition:width .5s}
/* DEBT WIDGET */
.debt-widget{background:var(--white);border-radius:14px;margin:0 16px;padding:14px;border:1px solid var(--parchment);cursor:pointer}
.dw-top{display:flex;justify-content:space-between;align-items:flex-start}
.dw-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:600}
.dw-amt{font-size:26px;font-weight:600;color:var(--ink);margin:4px 0 2px}
.dw-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;background:var(--blush);color:var(--terra2)}
.dw-next{font-size:12px;color:var(--ink3)}
/* TX */
.tx-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.tx-date-header{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:600;padding:8px 0 2px}
.tx-row{background:var(--white);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:1px solid var(--parchment)}
.tx-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:11px;color:var(--ink3);margin-top:1px}
.tx-amt{font-size:14px;font-weight:600;white-space:nowrap}
.tx-amt.inc{color:var(--green)}.tx-amt.exp{color:var(--red)}
/* WALLET */
.wallet-group{margin:0 16px 10px}
.wg-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px}
.wg-title{font-size:13px;font-weight:600}
.wg-total{font-size:13px;font-weight:500;color:var(--ink2)}
.w-cards{display:flex;flex-direction:column;
